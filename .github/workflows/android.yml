name: GG Messenger Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build GG Messenger APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Create Android platform if missing
        run: if [ ! -d android ]; then flutter create --platforms=android --project-name gg_messenger .; fi
      - name: Configure Android permissions for chat, calls and media
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if marker not in s:
              raise SystemExit('AndroidManifest.xml manifest tag not found')
          permissions = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.RECORD_AUDIO',
              'android.permission.CAMERA',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.BLUETOOTH',
              'android.permission.BLUETOOTH_CONNECT',
          ]
          additions = ''.join(
              f'    <uses-permission android:name="{permission}" />\n'
              for permission in permissions
              if permission not in s
          )
          if additions:
              s = s.replace(marker, marker + '\n' + additions, 1)
              p.write_text(s)
          PY
          for p in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE android.permission.RECORD_AUDIO android.permission.CAMERA android.permission.MODIFY_AUDIO_SETTINGS; do grep -q "$p" android/app/src/main/AndroidManifest.xml; done
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Prepare GG logo
        run: |
          test -s assets/branding/gg_logo.svg
          rsvg-convert -w 1024 -h 1024 assets/branding/gg_logo.svg -o assets/branding/gg_logo.png
          test -s assets/branding/gg_logo.png
      - name: Get dependencies
        run: flutter pub get
      - name: Apply premium chat UI
        run: python3 tool/upgrade_chat_ui.py
      - name: Preserve chat during realtime reconnects
        run: python3 tool/fix_chat_stream.py
      - name: Generate GG launcher icon
        run: dart run flutter_launcher_icons
      - name: Verify Android network, call permissions and launcher configuration
        run: |
          test -s assets/branding/gg_logo.png
          test -s android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/launcher_icon"' android/app/src/main/AndroidManifest.xml || grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Analyze code (non-blocking)
        run: flutter analyze --no-fatal-infos || true
      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          groovy = Path('android/app/build.gradle')
          kotlin = Path('android/app/build.gradle.kts')
          if groovy.exists():
              p, s = groovy, groovy.read_text()
              if 'coreLibraryDesugaringEnabled true' not in s:
                  marker = 'compileOptions {'
                  if marker in s:
                      s = s.replace(marker, marker + '\n        coreLibraryDesugaringEnabled true', 1)
                  else:
                      s = s.replace('android {', 'android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true\n    }', 1)
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
              if 'desugar_jdk_libs' not in s:
                  s = s.replace('dependencies {', 'dependencies {\n    ' + dep, 1) if 'dependencies {' in s else s + '\n\ndependencies {\n    ' + dep + '\n}\n'
              p.write_text(s)
          elif kotlin.exists():
              p, s = kotlin, kotlin.read_text()
              if 'isCoreLibraryDesugaringEnabled = true' not in s:
                  marker = 'compileOptions {'
                  if marker in s:
                      s = s.replace(marker, marker + '\n        isCoreLibraryDesugaringEnabled = true', 1)
                  else:
                      s = s.replace('android {', 'android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n    }', 1)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
              if 'desugar_jdk_libs' not in s:
                  s = s.replace('dependencies {', 'dependencies {\n    ' + dep, 1) if 'dependencies {' in s else s + '\n\ndependencies {\n    ' + dep + '\n}\n'
              p.write_text(s)
          else:
              raise SystemExit('No Android app Gradle file found')
          PY
      - name: Clean Flutter build
        run: flutter clean
      - name: Get dependencies again
        run: flutter pub get
      - name: Build release APK with IPv4/IPv6 DNS workaround
        run: flutter build apk --release --dart-define=dart.library.io.force_staggered_ipv6_lookup=true
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: GG-Messenger-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
