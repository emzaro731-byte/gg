
name: GG Messenger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-app

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # 3. Create Android platform files if needed
      - name: Prepare Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name gg_messenger \
            .

      # 4. Configure Android permissions
      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if manifest.exists():
              text = manifest.read_text()

              permissions = [
                  'android.permission.INTERNET',
                  'android.permission.ACCESS_NETWORK_STATE',
                  'android.permission.CAMERA',
                  'android.permission.RECORD_AUDIO',
                  'android.permission.MODIFY_AUDIO_SETTINGS',
                  'android.permission.VIBRATE',
                  'android.permission.POST_NOTIFICATIONS',
                  'android.permission.READ_MEDIA_IMAGES',
                  'android.permission.READ_MEDIA_VIDEO',
              ]

              additions = []

              for permission in permissions:
                  line = f'    <uses-permission android:name="{permission}"/>'
                  if permission not in text:
                      additions.append(line)

              if additions:
                  marker = '<manifest'
                  start = text.find('>', text.find(marker))

                  if start != -1:
                      insert = '\n' + '\n'.join(additions)
                      text = text[:start + 1] + insert + text[start + 1:]

              manifest.write_text(text)

          print("Android permissions configured.")
          PY

      # 5. Enable core library desugaring
      - name: Enable core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("android/app/build.gradle not found")

          s = p.read_text()

          if "coreLibraryDesugaringEnabled true" not in s:
              if "compileOptions {" in s:
                  s = s.replace(
                      "compileOptions {",
                      "compileOptions {\n        coreLibraryDesugaringEnabled true",
                      1
                  )
              else:
                  s += """
          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """

          if "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs" not in s:
              marker = "dependencies {"

              dependency = """
          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
          """

              if marker in s:
                  s = s.replace(marker, dependency, 1)
              else:
                  s += dependency

          p.write_text(s)

          print("Core library desugaring configured.")
          PY

      # 6. Verify the exact GG logo exists
      - name: Verify exact GG logo
        run: |
          if [ ! -f "assets/images/gg_logo.png" ]; then
            echo "ERROR: Exact GG logo not found."
            echo "Expected file: assets/images/gg_logo.png"
            echo "Please upload the exact approved PNG to that location."
            exit 1
          fi

          file assets/images/gg_logo.png
          ls -lh assets/images/gg_logo.png

      # 7. Install Flutter dependencies
      - name: Flutter pub get
        run: |
          flutter pub get

      # 8. Generate launcher icon from exact logo
      - name: Generate GG launcher icon
        run: |
          dart run flutter_launcher_icons

      # 9. Apply premium chat UI
      - name: Apply premium chat UI
        run: |
          if [ -f "tool/upgrade_chat_ui.py" ]; then
            python3 tool/upgrade_chat_ui.py
          else
            echo "Premium chat UI script not found; continuing."
          fi

      # 10. Apply offline-first chat adapter
      - name: Apply offline-first chat adapter
        run: |
          if [ -f "lib/chat_page.dart" ] && [ -f "lib/offline_first_chat_page.dart" ]; then
            cp lib/chat_page.dart lib/realtime_chat_page.dart
            cp lib/offline_first_chat_page.dart lib/chat_page.dart
            echo "Offline-first chat adapter applied."
          else
            echo "Offline-first chat files not found; continuing."
          fi

      # 11. Repair Dart syntax
      - name: Repair Dart syntax
        run: |
          if [ -f "tool/repair_dart_syntax.py" ]; then
            python3 tool/repair_dart_syntax.py
          else
            echo "Dart repair script not found; continuing."
          fi

      # 12. Format Dart code
      - name: Format Dart
        run: |
          dart format lib

      # 13. Remove default Flutter test if present
      - name: Remove default test
        run: |
          rm -f test/widget_test.dart

      # 14. Analyze project
      - name: Flutter analyze
        run: |
          flutter analyze --no-fatal-infos

      # 15. Build release APK
      - name: Build release APK
        run: |
          flutter build apk --release

      # 16. Rename APK
      - name: Rename APK
        run: |
          mkdir -p build/releases

          cp build/app/outputs/flutter-apk/app-release.apk \
             build/releases/GG-Messenger-release.apk

          ls -lh build/releases/GG-Messenger-release.apk

      # 17. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GG-Messenger-APK
          path: build/releases/GG-Messenger-release.apk
          if-no-files-found: error
          retention-days: 30

Also update "pubspec.yaml"

Make sure these sections exist:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/gg_logo.png"
  adaptive_icon_background: "#050816"
  adaptive_icon_foreground: "assets/images/gg_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/gg_logo.png

