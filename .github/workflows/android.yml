name: Build GG Messenger APK

on:
  workflow_dispatch:
  push:
    branches: [android-app]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Generate Android project only
        run: flutter create --platforms=android --project-name gg_messenger .

      - name: Fix Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/build.gradle')
          s = p.read_text()

          # Flutter plugins in this project require core library desugaring.
          # Make the setting explicit and add the required desugaring library.
          if 'coreLibraryDesugaringEnabled' not in s:
              needle = 'android {'
              if needle not in s:
                  raise SystemExit('android { block not found in android/app/build.gradle')
              s = s.replace(
                  needle,
                  needle + '''\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }''',
                  1,
              )

          dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
          if 'desugar_jdk_libs' not in s:
              if '\ndependencies {' in s:
                  s = s.replace(
                      '\ndependencies {',
                      '\ndependencies {\n    ' + dependency,
                      1,
                  )
              else:
                  s += '\n\ndependencies {\n    ' + dependency + '\n}\n'

          p.write_text(s)
          print('Updated android/app/build.gradle for core library desugaring')
          PY

          echo '--- android/app/build.gradle desugaring configuration ---'
          grep -n -A5 -B2 'desugar\|coreLibraryDesugaring\|compileOptions' android/app/build.gradle || true

      - name: Configure Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''\
              <uses-feature android:name="android.hardware.camera" />
              <uses-feature android:name="android.hardware.camera.autofocus" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
          '''
          if 'android.permission.INTERNET' not in s:
              s = s.replace(marker, marker + permissions)
          manifest.write_text(s)
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Apply offline-first chat adapter
        run: |
          cp lib/chat_page.dart lib/realtime_chat_page.dart
          cp lib/offline_first_chat_page.dart lib/chat_page.dart

      - name: Format Dart sources
        run: dart format lib

      - name: Remove obsolete default widget test
        run: rm -f test/widget_test.dart

      - name: Analyze Android app
        run: flutter analyze --no-fatal-infos

      - name: Build APK only
        run: flutter build apk --release

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: gg-messenger-apk-${{ github.run_number }}
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-release.apk
