name: Build GG Messenger APK

on:
  workflow_dispatch:
  push:
    branches: [android-app]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Generate Android project only
        run: flutter create --platforms=android --project-name gg_messenger .

      - name: Fix Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          groovy = Path('android/app/build.gradle')
          kotlin = Path('android/app/build.gradle.kts')

          if kotlin.exists():
              p = kotlin
              s = p.read_text()

              if 'isCoreLibraryDesugaringEnabled = true' not in s:
                  if 'compileOptions {' in s:
                      s = s.replace(
                          'compileOptions {',
                          'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                          1,
                      )
                  else:
                      s = s.replace(
                          'android {',
                          'android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }',
                          1,
                      )

              if 'desugar_jdk_libs' not in s:
                  dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
                  if 'dependencies {' in s:
                      s = s.replace('dependencies {', 'dependencies {\n' + dependency, 1)
                  else:
                      s += '\n\ndependencies {\n' + dependency + '\n}\n'
          elif groovy.exists():
              p = groovy
              s = p.read_text()

              if 'coreLibraryDesugaringEnabled true' not in s:
                  if 'compileOptions {' in s:
                      s = s.replace(
                          'compileOptions {',
                          'compileOptions {\n        coreLibraryDesugaringEnabled true',
                          1,
                      )
                  else:
                      s = s.replace(
                          'android {',
                          'android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }',
                          1,
                      )

              if 'desugar_jdk_libs' not in s:
                  dependency = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
                  if 'dependencies {' in s:
                      s = s.replace('dependencies {', 'dependencies {\n' + dependency, 1)
                  else:
                      s += '\n\ndependencies {\n' + dependency + '\n}\n'
          else:
              raise SystemExit('Neither android/app/build.gradle nor build.gradle.kts exists')

          p.write_text(s)
          print(f'Updated {p} for core library desugaring')
          PY

          echo '--- Android desugaring configuration ---'
          grep -R -n -A5 -B2 'desugar\|coreLibraryDesugaring\|compileOptions' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true

      - name: Configure Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''\
              <uses-feature android:name="android.hardware.camera" />
              <uses-feature android:name="android.hardware.camera.autofocus" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
          '''
          if 'android.permission.INTERNET' not in s:
              s = s.replace(marker, marker + permissions)
          manifest.write_text(s)
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Apply offline-first chat adapter
        run: |
          cp lib/chat_page.dart lib/realtime_chat_page.dart
          cp lib/offline_first_chat_page.dart lib/chat_page.dart

      - name: Format Dart sources
        run: dart format lib

      - name: Remove obsolete default widget test
        run: rm -f test/widget_test.dart

      - name: Analyze Android app
        run: flutter analyze --no-fatal-infos

      - name: Build APK only
        run: flutter build apk --release

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: gg-messenger-apk-${{ github.run_number }}
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-release.apk
