name: GG Messenger Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build GG Messenger APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Create Android platform if missing
        run: if [ ! -d android ]; then flutter create --platforms=android --project-name gg_messenger .; fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Prepare GG logo
        run: |
          test -s assets/branding/gg_logo.svg
          rsvg-convert -w 1024 -h 1024 assets/branding/gg_logo.svg -o assets/branding/gg_logo.png
          test -s assets/branding/gg_logo.png

      - name: Get dependencies
        run: flutter pub get

      - name: Generate GG launcher icon
        run: dart run flutter_launcher_icons

      - name: Verify GG launcher icon
        run: |
          test -s assets/branding/gg_logo.png
          test -s android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/launcher_icon"' android/app/src/main/AndroidManifest.xml || grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Analyze code (non-blocking)
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: GG-Messenger-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
