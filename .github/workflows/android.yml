name: GG Messenger Android APK

on:
  push:
    branches:
      - main
      - android-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build GG Messenger APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --project-name gg_messenger .

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Verify logo
        run: test -f assets/images/gg_logo.png

      - name: Harden offline networking and auth errors
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/offline_first_chats_page.dart')
          s = p.read_text()

          if "import 'dart:io';" not in s:
              s = s.replace(
                  "import 'dart:async';",
                  "import 'dart:async';\nimport 'dart:io';",
                  1,
              )

          s = s.replace("bool _online = true;", "bool _online = false;", 1)

          old = """  Future<void> _refreshConnectivity() async {
    try {
      _setConnectivity(await connectivity.checkConnectivity());
    } catch (_) {
      _setConnectivity(const [ConnectivityResult.none]);
    }
  }"""

          new = """  Future<void> _refreshConnectivity() async {
    try {
      final result = await connectivity.checkConnectivity();

      if (result.contains(ConnectivityResult.none) || result.isEmpty) {
        _setConnectivity(const [ConnectivityResult.none]);
        return;
      }

      final host = Uri.parse(supabase.supabaseUrl).host;
      await InternetAddress.lookup(host)
          .timeout(const Duration(seconds: 4));

      _setConnectivity(result);
    } catch (_) {
      _setConnectivity(const [ConnectivityResult.none]);
    }
  }"""

          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('lib/email_password_auth_page.dart')
          s = p.read_text()

          if "import 'dart:io';" not in s:
              s = s.replace(
                  "import 'package:flutter/material.dart';",
                  "import 'dart:io';\n\nimport 'package:flutter/material.dart';",
                  1,
              )

          old = """    } catch (_) {
      if (mounted) {
        setState(() => error = 'Authentication failed. Please try again.');
      }
    } finally {"""

          new = """    } on SocketException {
      if (mounted) {
        setState(() => error =
            'No internet connection. Your account can only be signed in online.');
      }
    } catch (_) {
      if (mounted) {
        setState(() => error = 'Authentication failed. Please try again.');
      }
    } finally {"""

          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: GG-Messenger-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
