name: Build GG Messenger Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name gg_messenger .

      - name: Remove generated demo test and lint config
        run: |
          rm -f test/widget_test.dart
          rm -f analysis_options.yaml

      - name: Configure Android permissions and notification desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''\
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.camera" />
              <uses-feature android:name="android.hardware.camera.autofocus" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
          '''
          if 'android.permission.CAMERA' not in s:
              s = s.replace(marker, marker + permissions)
          manifest.write_text(s)

          gradle = Path('android/app/build.gradle')
          s = gradle.read_text()
          if 'coreLibraryDesugaringEnabled true' not in s:
              anchor = 'android {\n'
              replacement = '''android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n\n'''
              s = s.replace(anchor, replacement, 1)
          if 'multiDexEnabled true' not in s:
              s = s.replace('defaultConfig {\n', 'defaultConfig {\n        multiDexEnabled true\n', 1)
          if 'coreLibraryDesugaring ' not in s:
              s = s.replace('dependencies {\n', "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n", 1)
          gradle.write_text(s)
          PY

      - name: Upgrade premium interface
        run: python3 tool/upgrade_interface.py

      - name: Modernize Flutter color APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = ['lib/chat_page.dart', 'lib/group_manage_page.dart', 'lib/premium_chats_page.dart', 'lib/status_page.dart']
          for name in files:
              p = Path(name)
              s = p.read_text()
              s = s.replace('.withOpacity(', '.withValues(alpha: ')
              p.write_text(s)
          p = Path('lib/status_page.dart')
          s = p.read_text()
          s = s.replace("    final scheme = Theme.of(context).colorScheme;\n    return Scaffold(\n      body:", "    return Scaffold(\n      body:")
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gg-messenger-android-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
