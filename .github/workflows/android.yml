name: Build GG Messenger Offline Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name gg_messenger .

      - name: Remove generated demo test and lint config
        run: |
          rm -f test/widget_test.dart
          rm -f analysis_options.yaml

      - name: Configure offline Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''\
              <uses-feature android:name="android.hardware.camera" />
              <uses-feature android:name="android.hardware.camera.autofocus" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
          '''
          if 'android.permission.CAMERA' not in s:
              s = s.replace(marker, marker + permissions)
          manifest.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Format offline app
        run: dart format lib/main.dart

      - name: Analyze offline app
        run: flutter analyze --no-fatal-infos lib/main.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gg-messenger-offline-android-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
