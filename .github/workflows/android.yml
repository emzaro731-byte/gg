name: GG Messenger Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build GG Messenger APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Create Android platform if missing
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name gg_messenger .
          fi
      - name: Install Firebase Android config
        run: test -s android/app/google-services.json
      - name: Configure Google Services Gradle plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle')
          settings_kts = Path('android/settings.gradle.kts')
          if settings.exists():
              p, s = settings, settings.read_text()
              if 'com.google.gms.google-services' not in s:
                  marker = 'plugins {\n'
                  if marker not in s: raise SystemExit('settings.gradle plugins block not found')
                  s = s.replace(marker, marker + '    id "com.google.gms.google-services" version "4.4.3" apply false\n', 1)
              p.write_text(s)
          elif settings_kts.exists():
              p, s = settings_kts, settings_kts.read_text()
              if 'com.google.gms.google-services' not in s:
                  marker = 'plugins {\n'
                  if marker not in s: raise SystemExit('settings.gradle.kts plugins block not found')
                  s = s.replace(marker, marker + '    id("com.google.gms.google-services") version "4.4.3" apply false\n', 1)
              p.write_text(s)
          else: raise SystemExit('No Android settings Gradle file found')
          groovy = Path('android/app/build.gradle')
          kotlin = Path('android/app/build.gradle.kts')
          if groovy.exists():
              p, s = groovy, groovy.read_text()
              if 'id "com.google.gms.google-services"' not in s:
                  marker = 'plugins {\n'
                  if marker not in s: raise SystemExit('app build.gradle plugins block not found')
                  s = s.replace(marker, marker + '    id "com.google.gms.google-services"\n', 1)
              p.write_text(s)
          elif kotlin.exists():
              p, s = kotlin, kotlin.read_text()
              if 'id("com.google.gms.google-services")' not in s:
                  marker = 'plugins {\n'
                  if marker not in s: raise SystemExit('app build.gradle.kts plugins block not found')
                  s = s.replace(marker, marker + '    id("com.google.gms.google-services")\n', 1)
              p.write_text(s)
          else: raise SystemExit('No Android app Gradle file found')
          PY
      - name: Configure Android permissions and use committed GG icon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if marker not in s: raise SystemExit('AndroidManifest.xml manifest tag not found')
          permissions = ['android.permission.INTERNET','android.permission.ACCESS_NETWORK_STATE','android.permission.RECORD_AUDIO','android.permission.CAMERA','android.permission.MODIFY_AUDIO_SETTINGS','android.permission.BLUETOOTH','android.permission.BLUETOOTH_CONNECT','android.permission.POST_NOTIFICATIONS','android.permission.USE_FULL_SCREEN_INTENT']
          additions = ''.join(f'    <uses-permission android:name="{permission}" />\n' for permission in permissions if permission not in s)
          if additions: s = s.replace(marker, marker + '\n' + additions, 1)
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/gg_logo"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/gg_logo"')
          p.write_text(s)
          PY
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install committed GG icon
        run: |
          test -s assets/branding/gg_logo.svg
          test -s assets/branding/gg_logo_icon.png
          mkdir -p android/app/src/main/res/drawable
          cp assets/branding/gg_logo_icon.png android/app/src/main/res/drawable/gg_logo.png
      - name: Get dependencies
        run: flutter pub get
      - name: Apply native Flutter interface
        run: python3 tool/upgrade_native_interface.py
      - name: Apply Firebase messaging runtime wiring
        run: python3 tool/fix_firebase_messaging.py
      - name: Apply premium chat UI
        run: python3 tool/upgrade_chat_ui.py
      - name: Fix chat composer Dart syntax
        run: python3 tool/fix_chat_syntax.py
      - name: Fix GG chat send button and call ringing
        run: python3 tool/fix_runtime_chat_calls.py
      - name: Preserve chat during realtime reconnects
        run: python3 tool/fix_chat_stream.py
      - name: Verify committed GG branding is used
        run: |
          test -s assets/branding/gg_logo.svg
          test -s assets/branding/gg_logo_icon.png
          test -s android/app/src/main/res/drawable/gg_logo.png
          grep -q 'android:icon="@drawable/gg_logo"' android/app/src/main/AndroidManifest.xml
      - name: Verify Firebase configuration
        run: |
          test -s android/app/google-services.json
          grep -q '"package_name": "com.example.gg_messenger"' android/app/google-services.json
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Analyze code (non-blocking)
        run: flutter analyze --no-fatal-infos || true
      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          groovy = Path('android/app/build.gradle')
          kotlin = Path('android/app/build.gradle.kts')
          if groovy.exists():
              p, s = groovy, groovy.read_text()
              if 'coreLibraryDesugaringEnabled true' not in s:
                  marker = 'compileOptions {'
                  if marker in s: s = s.replace(marker, marker + '\n        coreLibraryDesugaringEnabled true', 1)
                  else: s = s.replace('android {', 'android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true\n    }', 1)
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
              if 'desugar_jdk_libs' not in s: s = s.replace('dependencies {', 'dependencies {\n    ' + dep, 1) if 'dependencies {' in s else s + '\n\ndependencies {\n    ' + dep + '\n}\n'
              p.write_text(s)
          elif kotlin.exists():
              p, s = kotlin, kotlin.read_text()
              if 'isCoreLibraryDesugaringEnabled = true' not in s:
                  marker = 'compileOptions {'
                  if marker in s: s = s.replace(marker, marker + '\n        isCoreLibraryDesugaringEnabled = true', 1)
                  else: s = s.replace('android {', 'android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n    }', 1)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
              if 'desugar_jdk_libs' not in s: s = s.replace('dependencies {', 'dependencies {\n    ' + dep, 1) if 'dependencies {' in s else s + '\n\ndependencies {\n    ' + dep + '\n}\n'
              p.write_text(s)
          else: raise SystemExit('No Android app Gradle file found')
          PY
      - name: Clean Flutter build
        run: flutter clean
      - name: Get dependencies again
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --dart-define=dart.library.io.force_staggered_ipv6_lookup=true
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: GG-Messenger-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
