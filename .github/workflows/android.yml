name: Build GG Messenger APK

on:
  workflow_dispatch:
  push:
    branches: [android-app]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Generate Android project only
        run: flutter create --platforms=android --project-name gg_messenger .

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          groovy = Path('android/app/build.gradle')
          kotlin = Path('android/app/build.gradle.kts')

          if groovy.exists():
              p = groovy
              s = p.read_text()
              if 'coreLibraryDesugaringEnabled true' not in s:
                  s = s.replace(
                      'android {',
                      'android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }',
                      1,
                  )
              if 'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:' not in s:
                  s = s.replace(
                      'dependencies {',
                      'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"',
                      1,
                  )
              p.write_text(s)
          elif kotlin.exists():
              p = kotlin
              s = p.read_text()
              if 'isCoreLibraryDesugaringEnabled = true' not in s:
                  s = s.replace(
                      'android {',
                      'android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }',
                      1,
                  )
              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in s:
                  s = s.replace(
                      'dependencies {',
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',
                      1,
                  )
              p.write_text(s)
          else:
              raise SystemExit('Android app Gradle build file not found')
          PY

      - name: Configure Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''\
              <uses-feature android:name="android.hardware.camera" />
              <uses-feature android:name="android.hardware.camera.autofocus" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
          '''
          if 'android.permission.INTERNET' not in s:
              s = s.replace(marker, marker + permissions)
          manifest.write_text(s)
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Apply offline-first chat adapter
        run: |
          cp lib/chat_page.dart lib/realtime_chat_page.dart
          cp lib/offline_first_chat_page.dart lib/chat_page.dart

      - name: Format Dart sources
        run: dart format lib

      - name: Remove obsolete default widget test
        run: rm -f test/widget_test.dart

      - name: Analyze Android app
        run: flutter analyze --no-fatal-infos

      - name: Build APK only
        run: flutter build apk --release

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: gg-messenger-apk-${{ github.run_number }}
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-release.apk
