name: Deploy GG AI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: vihbsfrwnslnmheowkhy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase deployment access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          }

      - name: Deploy GG AI Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Deploying gg-ai-chat using secrets already stored in Supabase..."
          supabase functions deploy gg-ai-chat --project-ref "$SUPABASE_PROJECT_REF"
