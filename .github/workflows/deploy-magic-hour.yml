name: Deploy Magic Hour Image Function

on:
  workflow_dispatch:

permissions:
  contents: read

# Project ref is public project metadata, not a secret.
env:
  SUPABASE_PROJECT_REF: vihbsfrwnslnmheowkhy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure image AI secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MAGIC_HOUR_API_KEY: ${{ secrets.MAGIC_HOUR_API_KEY }}
          MY_AI_API_URL: ${{ secrets.MY_AI_API_URL }}
          MY_AI_API_KEY: ${{ secrets.MY_AI_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN MAGIC_HOUR_API_KEY MY_AI_API_URL MY_AI_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: GitHub Actions secret $name is missing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Open repository Settings > Secrets and variables > Actions and add the missing secrets."
            exit 1
          fi

          supabase secrets set \
            MAGIC_HOUR_API_KEY="$MAGIC_HOUR_API_KEY" \
            MY_AI_API_URL="$MY_AI_API_URL" \
            MY_AI_API_KEY="$MY_AI_API_KEY" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy image function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy gg-image-generate --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
