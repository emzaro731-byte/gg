name: Deploy Magic Hour Image Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure image AI secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          MAGIC_HOUR_API_KEY: ${{ secrets.MAGIC_HOUR_API_KEY }}
          MY_AI_API_URL: ${{ secrets.MY_AI_API_URL }}
          MY_AI_API_KEY: ${{ secrets.MY_AI_API_KEY }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$MAGIC_HOUR_API_KEY"
          test -n "$MY_AI_API_URL"
          test -n "$MY_AI_API_KEY"
          supabase secrets set \
            MAGIC_HOUR_API_KEY="$MAGIC_HOUR_API_KEY" \
            MY_AI_API_URL="$MY_AI_API_URL" \
            MY_AI_API_KEY="$MY_AI_API_KEY" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy image function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy gg-image-generate --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
