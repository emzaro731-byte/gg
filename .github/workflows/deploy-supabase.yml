name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing GitHub secret: SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Missing GitHub secret: SUPABASE_PROJECT_REF'; exit 1; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply database migrations
        shell: bash
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing GitHub secret: SUPABASE_DB_PASSWORD. Database migrations were not applied.'; exit 1; }
          supabase db push --linked --yes

      - name: Deploy GG AI
        run: supabase functions deploy gg-ai-chat --no-verify-jwt

      - name: Deploy call push
        run: supabase functions deploy send-call-push

      - name: Configure GG AI secrets
        shell: bash
        run: |
          test -n "${{ secrets.GROQ_API_KEY }}" || { echo 'Missing GitHub secret: GROQ_API_KEY'; exit 1; }
          supabase secrets set GROQ_API_KEY='${{ secrets.GROQ_API_KEY }}' GROQ_MODEL='openai/gpt-oss-120b'
