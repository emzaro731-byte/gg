name: Fix const analyzer errors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Apply Dart analyzer fixes
        run: dart fix --apply

      - name: Format affected files
        run: dart format lib/chat_page.dart lib/gg_ai_page.dart lib/status_page.dart lib/gg_image_page.dart

      - name: Verify analyzer
        run: flutter analyze --no-fatal-infos

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No changes were necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/chat_page.dart lib/gg_ai_page.dart lib/status_page.dart lib/gg_image_page.dart
          git commit -m 'fix: resolve Dart const analyzer errors'
          git push
