name: Fix const analyzer errors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Remove the two invalid const constructors
        run: |
          python - <<'PY'
          from pathlib import Path

          files = ('lib/chat_page.dart', 'lib/gg_ai_page.dart')
          replacements = {
              'const Padding(': 'Padding(',
              'const Align(': 'Align(',
          }
          for filename in files:
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Apply remaining Dart analyzer fixes
        run: dart fix --apply

      - name: Format affected files
        run: dart format lib/chat_page.dart lib/status_page.dart lib/gg_ai_page.dart lib/gg_image_page.dart

      - name: Verify analyzer
        run: flutter analyze --no-fatal-infos

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No changes were necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/chat_page.dart lib/status_page.dart lib/gg_ai_page.dart lib/gg_image_page.dart
          git commit -m 'fix: remove invalid const constructors'
          git push
