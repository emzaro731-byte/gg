name: Fix GG Messenger Web Compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-web-compat.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Apply web compatibility fixes
        shell: python
        run: |
          from pathlib import Path

          pub = Path('pubspec.yaml')
          text = pub.read_text()
          if '  http: ^1.6.0\n' not in text:
              text = text.replace('  intl: ^0.19.0\n', '  intl: ^0.19.0\n  http: ^1.6.0\n')
              pub.write_text(text)

          Path('lib/services/recording_file.dart').write_text("""export 'recording_file_io.dart'\n    if (dart.library.io) 'recording_file_io.dart'\n    if (dart.library.js_interop) 'recording_file_web.dart';\n""")

          Path('lib/services/recording_file_io.dart').write_text("""import 'dart:io';\nimport 'dart:typed_data';\n\nimport 'package:path_provider/path_provider.dart';\n\nFuture<String> recordingPath(String filename) async {\n  final dir = await getTemporaryDirectory();\n  return '${dir.path}/$filename';\n}\n\nFuture<Uint8List> readRecordingBytes(String path) => File(path).readAsBytes();\n\nFuture<void> deleteRecordingFile(String path) async {\n  try {\n    await File(path).delete();\n  } catch (_) {}\n}\n\nconst recordingFileExtension = 'm4a';\nconst recordingMimeType = 'audio/mp4';\n""")

          Path('lib/services/recording_file_web.dart').write_text("""import 'dart:typed_data';\n\nimport 'package:http/http.dart' as http;\n\nFuture<String> recordingPath(String filename) async => '';\n\nFuture<Uint8List> readRecordingBytes(String path) async {\n  if (path.isEmpty) {\n    throw StateError('The browser did not return a recording URL.');\n  }\n  final response = await http.get(Uri.parse(path));\n  if (response.statusCode < 200 || response.statusCode >= 300) {\n    throw StateError('Unable to read the browser recording (${response.statusCode}).');\n  }\n  return response.bodyBytes;\n}\n\nFuture<void> deleteRecordingFile(String path) async {}\n\nconst recordingFileExtension = 'wav';\nconst recordingMimeType = 'audio/wav';\n""")

          chat = Path('lib/chat_page.dart')
          c = chat.read_text()
          c = c.replace("import 'dart:io';\n\n", "")
          c = c.replace("import 'package:path_provider/path_provider.dart';\n", "")
          c = c.replace("import 'package:flutter/material.dart';\n", "import 'package:flutter/foundation.dart';\nimport 'package:flutter/material.dart';\n")
          c = c.replace("import 'services/call_service.dart';\n", "import 'services/call_service.dart';\nimport 'services/recording_file.dart';\n")
          old = """        final bytes = await File(path).readAsBytes();\n        final storagePath = '$userId/${widget.conversationId}/${DateTime.now().millisecondsSinceEpoch}_voice.m4a';\n        await supabase.storage.from('chat-media').uploadBinary(\n          storagePath,\n          bytes,\n          fileOptions: const FileOptions(contentType: 'audio/mp4', upsert: false),\n        );\n        await supabase.from('messages').insert({\n          'conversation_id': widget.conversationId,\n          'sender_id': userId,\n          'body': 'Voice message',\n          'message_type': 'audio',\n          'media_url': storagePath,\n          'file_name': 'voice.m4a',\n          'file_size': bytes.length,\n          'mime_type': 'audio/mp4',\n          'duration_ms': duration,\n        });\n        try { await File(path).delete(); } catch (_) {}\n"""
          new = """        final bytes = await readRecordingBytes(path);\n        final storagePath = '$userId/${widget.conversationId}/${DateTime.now().millisecondsSinceEpoch}_voice.$recordingFileExtension';\n        await supabase.storage.from('chat-media').uploadBinary(\n          storagePath,\n          bytes,\n          fileOptions: FileOptions(contentType: recordingMimeType, upsert: false),\n        );\n        await supabase.from('messages').insert({\n          'conversation_id': widget.conversationId,\n          'sender_id': userId,\n          'body': 'Voice message',\n          'message_type': 'audio',\n          'media_url': storagePath,\n          'file_name': 'voice.$recordingFileExtension',\n          'file_size': bytes.length,\n          'mime_type': recordingMimeType,\n          'duration_ms': duration,\n        });\n        await deleteRecordingFile(path);\n"""
          if old not in c:
              raise SystemExit('chat stop-recording block not found')
          c = c.replace(old, new)
          old = """    final dir = await getTemporaryDirectory();\n    final path = '${dir.path}/gg_voice_${DateTime.now().millisecondsSinceEpoch}.m4a';\n    await recorder.start(const RecordConfig(encoder: AudioEncoder.aacLc, bitRate: 24000, sampleRate: 16000, numChannels: 1), path: path);\n"""
          new = """    final path = await recordingPath('gg_voice_${DateTime.now().millisecondsSinceEpoch}.$recordingFileExtension');\n    final encoder = kIsWeb ? AudioEncoder.wav : AudioEncoder.aacLc;\n    await recorder.start(RecordConfig(encoder: encoder, bitRate: 24000, sampleRate: 16000, numChannels: 1), path: path);\n"""
          if old not in c:
              raise SystemExit('chat start-recording block not found')
          c = c.replace(old, new)
          chat.write_text(c)

          status = Path('lib/status_page.dart')
          s = status.read_text()
          s = s.replace("import 'dart:io';\n\n", "")
          s = s.replace("""    final result = await FilePicker.platform.pickFiles(type: FileType.media, withData: false);\n    final file = result?.files.single;\n    if (file?.path == null) return;\n""", """    final result = await FilePicker.platform.pickFiles(type: FileType.media, withData: true);\n    final file = result?.files.single;\n    final bytes = file?.bytes;\n    if (file == null || bytes == null) return;\n""")
          s = s.replace("""    final contentType = isVideo ? 'video/$extension' : 'image/$extension';\n""", """    final contentType = _contentType(extension, isVideo);\n""")
          s = s.replace("""      await supabase.storage.from('status-media').upload(\n        storagePath,\n        File(file.path!),\n        fileOptions: FileOptions(contentType: contentType, upsert: false),\n      );\n""", """      await supabase.storage.from('status-media').uploadBinary(\n        storagePath,\n        bytes,\n        fileOptions: FileOptions(contentType: contentType, upsert: false),\n      );\n""")
          marker = """  Future<String?> _url(String path) async {\n"""
          helper = """  String _contentType(String extension, bool isVideo) {\n    const types = {\n      'jpg': 'image/jpeg', 'jpeg': 'image/jpeg', 'png': 'image/png', 'gif': 'image/gif', 'webp': 'image/webp',\n      'mp4': 'video/mp4', 'mov': 'video/quicktime', 'm4v': 'video/x-m4v', 'webm': 'video/webm',\n    };\n    return types[extension] ?? (isVideo ? 'video/*' : 'image/*');\n  }\n\n"""
          if marker not in s:
              raise SystemExit('status helper marker not found')
          s = s.replace(marker, helper + marker, 1)
          status.write_text(s)

      - name: Enable Flutter web
        run: flutter create --platforms=web .

      - name: Get dependencies
        run: flutter pub get

      - name: Verify web build
        run: flutter build web --release --base-href "/gg/"

      - name: Commit compatibility fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml lib/chat_page.dart lib/status_page.dart lib/services/recording_file.dart lib/services/recording_file_io.dart lib/services/recording_file_web.dart
          if git diff --cached --quiet; then
            echo "No compatibility changes needed."
          else
            git commit -m "fix: make GG Messenger web compatible"
            git push
          fi
