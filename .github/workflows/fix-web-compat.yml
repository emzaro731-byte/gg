name: Fix GG Messenger Web Compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Migrate deprecated Flutter color APIs
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('lib/chat_page.dart'),
              Path('lib/group_manage_page.dart'),
              Path('lib/status_page.dart'),
          ]

          total = 0
          pattern = re.compile(r'\.withOpacity\(([^()]*)\)')
          for path in files:
              text = path.read_text()
              updated, count = pattern.subn(r'.withValues(alpha: \1)', text)
              if count:
                  path.write_text(updated)
                  total += count
                  print(f'{path}: migrated {count} withOpacity call(s)')

          print(f'Total migrated: {total}')

      - name: Verify web compatibility source
        shell: python
        run: |
          from pathlib import Path

          pub = Path('pubspec.yaml').read_text()
          if '  http: ^1.6.0\n' not in pub:
              raise SystemExit('http dependency is missing from pubspec.yaml')

          chat = Path('lib/chat_page.dart').read_text()
          required_chat = [
              "import 'services/recording_file.dart';",
              'readRecordingBytes(path)',
              'deleteRecordingFile(path)',
              'kIsWeb ? AudioEncoder.wav : AudioEncoder.aacLc',
          ]
          missing_chat = [item for item in required_chat if item not in chat]
          if missing_chat:
              raise SystemExit('chat_page.dart is missing expected web recording support: ' + ', '.join(missing_chat))
          if "import 'dart:io';" in chat:
              raise SystemExit('chat_page.dart still imports dart:io')

          status = Path('lib/status_page.dart').read_text()
          required_status = [
              'withData: true',
              'uploadBinary(',
              'final bytes = file?.bytes;',
              'String _contentType(String extension, bool isVideo)',
          ]
          missing_status = [item for item in required_status if item not in status]
          if missing_status:
              raise SystemExit('status_page.dart is missing expected web upload support: ' + ', '.join(missing_status))
          if "import 'dart:io';" in status:
              raise SystemExit('status_page.dart still imports dart:io')

          recording = Path('lib/services/recording_file.dart').read_text()
          if 'dart.library.js_interop' not in recording:
              raise SystemExit('recording_file.dart is missing the web conditional export')
          for path in ['lib/services/recording_file_io.dart', 'lib/services/recording_file_web.dart']:
              if not Path(path).exists():
                  raise SystemExit(f'Missing required recording helper: {path}')

          print('Web compatibility source checks passed.')

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build web
        run: flutter build web --release --base-href "/gg/"

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/chat_page.dart lib/group_manage_page.dart lib/status_page.dart
          if git diff --cached --quiet; then
            echo "No source changes needed."
          else
            git commit -m "fix: migrate deprecated Flutter color APIs"
            git push
          fi
