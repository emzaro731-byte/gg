name: GG Messenger - Direct APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build GG Messenger APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --project-name gg_messenger .

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Convert GG logo to PNG
        run: |
          test -s assets/branding/gg_logo.svg
          rsvg-convert -w 1024 -h 1024 assets/branding/gg_logo.svg -o assets/branding/gg_logo.png
          test -s assets/branding/gg_logo.png

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons

      - name: Verify GG logo assets
        run: |
          test -s assets/branding/gg_logo.svg
          test -s assets/branding/gg_logo.png
          test -s android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/launcher_icon"' android/app/src/main/AndroidManifest.xml || \
            grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml

      - name: Remove generated Flutter sample test
        run: rm -f test/widget_test.dart

      - name: Format Dart sources
        run: dart format lib

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              p = groovy
              s = p.read_text()

              if "coreLibraryDesugaringEnabled true" not in s:
                  marker = "compileOptions {"
                  if marker in s:
                      s = s.replace(marker, marker + "\n        coreLibraryDesugaringEnabled true", 1)
                  else:
                      android_marker = "android {"
                      if android_marker not in s:
                          raise SystemExit("Could not find android { block in build.gradle")
                      s = s.replace(android_marker, android_marker + "\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true\n    }", 1)

              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
              if "desugar_jdk_libs" not in s:
                  if "dependencies {" in s:
                      s = s.replace("dependencies {", "dependencies {\n    " + dependency, 1)
                  else:
                      s += "\n\ndependencies {\n    " + dependency + "\n}\n"

              p.write_text(s)
              print("Patched android/app/build.gradle")

          elif kotlin.exists():
              p = kotlin
              s = p.read_text()

              if "isCoreLibraryDesugaringEnabled = true" not in s:
                  marker = "compileOptions {"
                  if marker in s:
                      s = s.replace(marker, marker + "\n        isCoreLibraryDesugaringEnabled = true", 1)
                  else:
                      android_marker = "android {"
                      if android_marker not in s:
                          raise SystemExit("Could not find android { block in build.gradle.kts")
                      s = s.replace(android_marker, android_marker + "\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n    }", 1)

              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
              if "desugar_jdk_libs" not in s:
                  if "dependencies {" in s:
                      s = s.replace("dependencies {", "dependencies {\n    " + dependency, 1)
                  else:
                      s += "\n\ndependencies {\n    " + dependency + "\n}\n"

              p.write_text(s)
              print("Patched android/app/build.gradle.kts")

          else:
              raise SystemExit("No android/app/build.gradle or build.gradle.kts found")
          PY

      - name: Show Android desugaring configuration
        run: |
          if [ -f android/app/build.gradle ]; then
            echo "===== android/app/build.gradle ====="
            grep -n -A8 -B3 "coreLibraryDesugaring\|desugar_jdk_libs" android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            echo "===== android/app/build.gradle.kts ====="
            grep -n -A8 -B3 "isCoreLibraryDesugaringEnabled\|desugar_jdk_libs" android/app/build.gradle.kts || true
          fi

      - name: Clean Flutter build
        run: flutter clean

      - name: Get Flutter dependencies again
        run: flutter pub get

      - name: Build release APK directly
        run: flutter build apk --release

      - name: Verify release APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk GG-Messenger-release.apk

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GG-Messenger-APK
          path: GG-Messenger-release.apk
          if-no-files-found: error
          retention-days: 30
