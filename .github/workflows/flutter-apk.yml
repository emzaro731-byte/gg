name: GG Messenger - Direct APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build GG Messenger APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --project-name gg_messenger .

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Verify GG logo asset
        run: test -s assets/branding/gg_logo.svg

      - name: Format Dart sources
        run: dart format lib

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK directly
        run: flutter build apk --release

      - name: Verify release APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk GG-Messenger-release.apk

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GG-Messenger-APK
          path: GG-Messenger-release.apk
          if-no-files-found: error
          retention-days: 30
