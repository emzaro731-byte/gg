name: GG Messenger - Direct APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build GG Messenger APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --project-name gg_messenger .

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Repair known Dart syntax blockers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          auth = Path('lib/email_password_auth_page.dart')
          auth.write_text(r'''import 'package:flutter/material.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';

          class LoginPage extends StatefulWidget {
            const LoginPage({super.key});
            @override State<LoginPage> createState() => _LoginPageState();
          }

          class _LoginPageState extends State<LoginPage> {
            final email = TextEditingController();
            final password = TextEditingController();
            final username = TextEditingController();
            final confirm = TextEditingController();
            bool signUp = false;
            bool loading = false;
            String? error;

            Future<void> submit() async {
              setState(() { loading = true; error = null; });
              try {
                final auth = Supabase.instance.client.auth;
                if (signUp) {
                  if (password.text.length < 8) throw const AuthException('Password must be at least 8 characters.');
                  if (password.text != confirm.text) throw const AuthException('Passwords do not match.');
                  if (username.text.trim().length < 3) throw const AuthException('Username must be at least 3 characters.');
                  await auth.signUp(email: email.text.trim(), password: password.text, data: {'username': username.text.trim().toLowerCase(), 'display_name': username.text.trim()});
                } else {
                  await auth.signInWithPassword(email: email.text.trim(), password: password.text);
                }
              } on AuthException catch (e) {
                if (mounted) setState(() => error = e.message);
              } catch (_) {
                if (mounted) setState(() => error = 'Authentication failed. Please try again.');
              } finally {
                if (mounted) setState(() => loading = false);
              }
            }

            @override void dispose() { email.dispose(); password.dispose(); username.dispose(); confirm.dispose(); super.dispose(); }

            @override Widget build(BuildContext context) => Scaffold(
              body: SafeArea(child: Center(child: SingleChildScrollView(padding: const EdgeInsets.all(24), child: ConstrainedBox(
                constraints: const BoxConstraints(maxWidth: 430),
                child: Column(children: [
                  const Icon(Icons.forum_rounded, size: 72),
                  const SizedBox(height: 18),
                  Text('GG Messenger', style: Theme.of(context).textTheme.headlineMedium?.copyWith(fontWeight: FontWeight.w900)),
                  const SizedBox(height: 28),
                  TextField(controller: email, enabled: !loading, keyboardType: TextInputType.emailAddress, decoration: const InputDecoration(labelText: 'Email address', prefixIcon: Icon(Icons.email_outlined))),
                  if (signUp) ...[
                    const SizedBox(height: 12),
                    TextField(controller: username, enabled: !loading, decoration: const InputDecoration(labelText: 'Username', prefixText: '@', prefixIcon: Icon(Icons.person_outline))),
                  ],
                  const SizedBox(height: 12),
                  TextField(controller: password, enabled: !loading, obscureText: true, decoration: const InputDecoration(labelText: 'Password', prefixIcon: Icon(Icons.lock_outline))),
                  if (signUp) ...[
                    const SizedBox(height: 12),
                    TextField(controller: confirm, enabled: !loading, obscureText: true, decoration: const InputDecoration(labelText: 'Confirm password', prefixIcon: Icon(Icons.lock_outline))),
                  ],
                  if (error != null) ...[const SizedBox(height: 14), Text(error!, textAlign: TextAlign.center, style: TextStyle(color: Colors.red))],
                  const SizedBox(height: 18),
                  SizedBox(width: double.infinity, height: 52, child: FilledButton(onPressed: loading ? null : submit, child: Text(loading ? 'Please wait...' : signUp ? 'Create account' : 'Sign in'))),
                  TextButton(onPressed: loading ? null : () => setState(() { signUp = !signUp; error = null; }), child: Text(signUp ? 'Already have an account? Sign in' : 'New here? Create an account')),
                ]),
              ))),
            );
          }

          class PasswordRecoveryPage extends StatelessWidget {
            const PasswordRecoveryPage({super.key});
            @override Widget build(BuildContext context) => Scaffold(body: Center(child: Padding(padding: const EdgeInsets.all(24), child: Column(mainAxisSize: MainAxisSize.min, children: [
              const Icon(Icons.lock_reset_rounded, size: 64),
              const SizedBox(height: 16),
              const Text('Password recovery', style: TextStyle(fontSize: 24, fontWeight: FontWeight.w800)),
              const SizedBox(height: 12),
              const Text('Please request a new recovery link if you need to reset your password.', textAlign: TextAlign.center),
              const SizedBox(height: 20),
              FilledButton(onPressed: () => Supabase.instance.client.auth.signOut(), child: const Text('Back to sign in')),
            ]))));
          }
          ''')

          power = Path('lib/power_chat_page.dart')
          power.write_text("""import 'package:flutter/material.dart';
          import 'chat_page.dart';

          class PowerChatPage extends StatelessWidget {
            const PowerChatPage({required this.conversationId, required this.title, super.key});
            final String conversationId;
            final String title;
            @override Widget build(BuildContext context) => ChatPage(conversationId: conversationId, title: title);
          }
          """)

          call = Path('lib/services/call_service.dart')
          text = call.read_text()
          marker = 'class _CallPageState extends State<CallPage> {'
          if marker in text:
              text = text.split(marker, 1)[0] + '''class _CallPageState extends State<CallPage> {
            final service = CallService.instance;
            String state = 'Calling…';

            @override void initState() { super.initState(); _init(); }

            Future<void> _init() async {
              try {
                await service.setupPeer(
                  callId: widget.callId,
                  localUserId: widget.localUserId,
                  video: widget.video,
                  isCaller: widget.isCaller,
                  onConnected: () { if (mounted) setState(() => state = 'Connected'); },
                  onRemoteStream: (_) { if (mounted) setState(() => state = 'Connected'); },
                  onState: (value) { if (mounted) setState(() => state = value.toString().split('.').last); },
                );
              } catch (_) { if (mounted) setState(() => state = 'Unable to connect'); }
            }

            Future<void> _end() async {
              await service.endCall(widget.callId);
              if (mounted) Navigator.maybePop(context);
            }

            @override void dispose() { unawaited(service.dispose()); super.dispose(); }

            @override Widget build(BuildContext context) => Scaffold(
              backgroundColor: Colors.black,
              body: SafeArea(child: Center(child: Column(mainAxisSize: MainAxisSize.min, children: [
                const CircleAvatar(radius: 58, child: Icon(Icons.person, size: 58)),
                const SizedBox(height: 20),
                Text(widget.title, style: const TextStyle(color: Colors.white, fontSize: 24, fontWeight: FontWeight.w700)),
                const SizedBox(height: 8),
                Text(state, style: const TextStyle(color: Colors.white70)),
                const SizedBox(height: 32),
                FloatingActionButton.large(backgroundColor: Colors.red, onPressed: _end, child: const Icon(Icons.call_end)),
              ]))),
            );
          }
          '''
          call.write_text(text)
          PY

      - name: Format Dart sources
        run: dart format lib

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK directly
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk GG-Messenger-release.apk

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GG-Messenger-APK
          path: GG-Messenger-release.apk
          if-no-files-found: error
          retention-days: 30
