name: GG Messenger - Direct APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build GG Messenger APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --project-name gg_messenger .

      - name: Enable Android network access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if marker not in s:
              raise SystemExit('AndroidManifest.xml manifest tag not found')
          permissions = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
          ]
          additions = ''.join(
              f'    <uses-permission android:name="{permission}" />\\n'
              for permission in permissions
              if permission not in s
          )
          if additions:
              s = s.replace(marker, marker + '\\n' + additions, 1)
              p.write_text(s)
          PY
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Convert GG logo to PNG
        run: |
          test -s assets/branding/gg_logo.svg
          rsvg-convert -w 1024 -h 1024 assets/branding/gg_logo.svg -o assets/branding/gg_logo.png
          test -s assets/branding/gg_logo.png

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons

      - name: Verify GG logo and network configuration
        run: |
          test -s assets/branding/gg_logo.svg
          test -s assets/branding/gg_logo.png
          test -s android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/launcher_icon"' android/app/src/main/AndroidManifest.xml || \
            grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml

      - name: Remove generated Flutter sample test
        run: rm -f test/widget_test.dart

      - name: Format Dart sources
        run: dart format lib

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              p = groovy
              s = p.read_text()
              if "coreLibraryDesugaringEnabled true" not in s:
                  marker = "compileOptions {"
                  if marker in s:
                      s = s.replace(marker, marker + "\n        coreLibraryDesugaringEnabled true", 1)
                  else:
                      s = s.replace("android {", "android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true\n    }", 1)
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
              if "desugar_jdk_libs" not in s:
                  if "dependencies {" in s:
                      s = s.replace("dependencies {", "dependencies {\n    " + dependency, 1)
                  else:
                      s += "\n\ndependencies {\n    " + dependency + "\n}\n"
              p.write_text(s)
          elif kotlin.exists():
              p = kotlin
              s = p.read_text()
              if "isCoreLibraryDesugaringEnabled = true" not in s:
                  marker = "compileOptions {"
                  if marker in s:
                      s = s.replace(marker, marker + "\n        isCoreLibraryDesugaringEnabled = true", 1)
                  else:
                      s = s.replace("android {", "android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n    }", 1)
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
              if "desugar_jdk_libs" not in s:
                  if "dependencies {" in s:
                      s = s.replace("dependencies {", "dependencies {\n    " + dependency, 1)
                  else:
                      s += "\n\ndependencies {\n    " + dependency + "\n}\n"
              p.write_text(s)
          else:
              raise SystemExit("No android/app/build.gradle or build.gradle.kts found")
          PY

      - name: Clean Flutter build
        run: flutter clean

      - name: Get Flutter dependencies again
        run: flutter pub get

      - name: Build release APK with IPv4/IPv6 DNS workaround
        run: flutter build apk --release --dart-define=dart.library.io.force_staggered_ipv6_lookup=true

      - name: Verify release APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk GG-Messenger-release.apk

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GG-Messenger-APK
          path: GG-Messenger-release.apk
          if-no-files-found: error
          retention-days: 30
