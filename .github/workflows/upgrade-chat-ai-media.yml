name: Upgrade chat AI media and feedback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Patch chat, status and image download
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]}')
              p.write_text(s.replace(old, new, 1))

          def insert_after(path, marker, addition):
              p = Path(path)
              s = p.read_text()
              if addition.strip() in s:
                  return
              if marker not in s:
                  raise SystemExit(f'Expected marker not found in {path}: {marker[:100]}')
              p.write_text(s.replace(marker, marker + addition, 1))

          # Chat imports and state.
          replace_once(
              'lib/chat_page.dart',
              "import 'package:supabase_flutter/supabase_flutter.dart';\n",
              "import 'package:supabase_flutter/supabase_flutter.dart';\nimport 'package:flutter/services.dart';\nimport 'package:share_plus/share_plus.dart';\nimport 'package:speech_to_text/speech_recognition_result.dart';\nimport 'package:speech_to_text/speech_to_text.dart' as stt;\n",
          )
          insert_after(
              'lib/chat_page.dart',
              '  final recorder = AudioRecorder();\n',
              '  final speech = stt.SpeechToText();\n',
          )
          insert_after(
              'lib/chat_page.dart',
              '  bool recording = false;\n',
              '  bool dictating = false;\n',
          )

          # Dictation, copy/share and feedback methods.
          methods = '''
  Future<void> _toggleDictation() async {
    if (dictating) {
      await speech.stop();
      if (mounted) setState(() => dictating = false);
      return;
    }
    final available = await speech.initialize(
      onStatus: (status) {
        if (mounted && status == 'done') setState(() => dictating = false);
      },
      onError: (_) {
        if (mounted) setState(() => dictating = false);
      },
    );
    if (!available) return;
    if (mounted) setState(() => dictating = true);
    await speech.listen(
      onResult: (SpeechRecognitionResult result) {
        if (!mounted) return;
        setState(() => controller.text = result.recognizedWords);
        controller.selection = TextSelection.collapsed(offset: controller.text.length);
      },
      listenOptions: const stt.SpeechListenOptions(
        partialResults: true,
        listenMode: stt.ListenMode.dictation,
      ),
    );
  }

  Future<void> _copyMessage(String text) async {
    await Clipboard.setData(ClipboardData(text: text));
    if (mounted) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('Copied')),
      );
    }
  }

  Future<void> _shareMessage(Map<String, dynamic> message) async {
    final path = message['media_url']?.toString();
    if (path != null && path.isNotEmpty) {
      final url = await signedUrl(path);
      if (url != null) {
        await Share.share(url);
      }
      return;
    }
    await Share.share(message['body']?.toString() ?? 'GG Messenger');
  }

  Future<void> _feedbackMessage(String id, int value) async {
    try {
      await supabase.from('message_feedback').upsert({
        'message_id': id,
        'user_id': userId,
        'value': value,
        'updated_at': DateTime.now().toUtc().toIso8601String(),
      });
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          SnackBar(content: Text(value == 1 ? 'Liked' : 'Disliked')),
        );
      }
    } catch (_) {}
  }

'''
          insert_after(
              'lib/chat_page.dart',
              '  Future<void> deleteMessage(String id) async {\n',
              methods,
          )

          # Insert actions after the existing Reply tile. The current file uses
          # formatted multi-line ListTile syntax, so match the stable onTap block.
          reply_marker = '''            ListTile(
              leading: const Icon(Icons.reply_rounded),
              title: const Text('Reply'),
              onTap: () {
                Navigator.pop(context);
                setState(() => replyingTo = message);
                focus.requestFocus();
              },
            ),
'''
          reply_actions = '''            ListTile(
              leading: const Icon(Icons.copy_rounded),
              title: const Text('Copy'),
              onTap: () {
                Navigator.pop(context);
                _copyMessage(message['body']?.toString() ?? '');
              },
            ),
            ListTile(
              leading: const Icon(Icons.share_rounded),
              title: const Text('Share'),
              onTap: () {
                Navigator.pop(context);
                _shareMessage(message);
              },
            ),
            ListTile(
              leading: const Icon(Icons.thumb_up_alt_outlined),
              title: const Text('Like'),
              onTap: () {
                Navigator.pop(context);
                _feedbackMessage(message['id'].toString(), 1);
              },
            ),
            ListTile(
              leading: const Icon(Icons.thumb_down_alt_outlined),
              title: const Text('Dislike'),
              onTap: () {
                Navigator.pop(context);
                _feedbackMessage(message['id'].toString(), -1);
              },
            ),
'''
          insert_after('lib/chat_page.dart', reply_marker, reply_actions)

          # Voice assistant button.
          insert_after(
              'lib/chat_page.dart',
              "                  IconButton(onPressed: toggleRecording, tooltip: recording ? 'Stop recording' : 'Voice message', icon: Icon(recording ? Icons.stop_circle_rounded : Icons.mic_none_rounded), color: recording ? scheme.error : null),\n",
              "                  IconButton(onPressed: _toggleDictation, tooltip: dictating ? 'Stop voice assistant' : 'Voice assistant', icon: Icon(dictating ? Icons.stop_circle_rounded : Icons.keyboard_voice_rounded), color: dictating ? scheme.error : null),\n",
          )
          replace_once(
              'lib/chat_page.dart',
              '    recorder.dispose();\n',
              '    speech.stop();\n    recorder.dispose();\n',
          )

          # Status reactions/share.
          replace_once(
              'lib/status_page.dart',
              "import 'package:video_player/video_player.dart';\n",
              "import 'package:video_player/video_player.dart';\nimport 'package:share_plus/share_plus.dart';\n",
          )
          insert_after(
              'lib/status_page.dart',
              '  Future<void> _load() async {\n',
              '''  Future<void> _react(String reaction) async {
    final id = widget.status['id']?.toString();
    final user = Supabase.instance.client.auth.currentUser;
    if (id == null || user == null) return;
    try {
      await Supabase.instance.client.from('status_reactions').upsert({
        'status_id': id,
        'user_id': user.id,
        'reaction': reaction,
      });
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          SnackBar(content: Text(reaction == 'like' ? 'Status liked' : 'Status disliked')),
        );
      }
    } catch (_) {}
  }

  Future<void> _share() async {
    final p = path;
    if (p == null) return;
    final u = await widget.signedUrl(p);
    if (u != null) await Share.share(u);
  }

''',
          )
          replace_once(
              'lib/status_page.dart',
              "      title: const Text('Status'),\n",
              "      title: const Text('Status'),\n      actions: [\n        IconButton(tooltip: 'Like', onPressed: () => _react('like'), icon: const Icon(Icons.thumb_up_alt_outlined)),\n        IconButton(tooltip: 'Dislike', onPressed: () => _react('dislike'), icon: const Icon(Icons.thumb_down_alt_outlined)),\n        IconButton(tooltip: 'Share', onPressed: _share, icon: const Icon(Icons.share_rounded)),\n      ],\n",
          )

          # Generated image download/share.
          replace_once(
              'lib/gg_image_page.dart',
              "import 'package:supabase_flutter/supabase_flutter.dart';\n",
              "import 'package:supabase_flutter/supabase_flutter.dart';\nimport 'package:http/http.dart' as http;\nimport 'package:share_plus/share_plus.dart';\n",
          )
          insert_after(
              'lib/gg_image_page.dart',
              '  void _clear() {\n',
              '''  Future<void> _downloadImage() async {
    final url = imageUrl;
    if (url == null) return;
    try {
      final response = await http.get(Uri.parse(url));
      if (response.statusCode >= 200 && response.statusCode < 300) {
        await Share.shareXFiles(
          [XFile.fromData(response.bodyBytes, mimeType: 'image/jpeg')],
          fileNameOverrides: const ['gg-generated-image.jpg'],
          text: 'Generated with GG AI',
        );
      } else {
        await Share.share(url);
      }
    } catch (_) {
      await Share.share(url);
    }
  }

''',
          )
          replace_once(
              'lib/gg_image_page.dart',
              '            const SizedBox(height: 8),\n            Text(\n',
              '''            const SizedBox(height: 10),
            Row(
              children: [
                Expanded(
                  child: FilledButton.icon(
                    onPressed: _downloadImage,
                    icon: const Icon(Icons.download_rounded),
                    label: const Text('Download / Share image'),
                  ),
                ),
              ],
            ),
            const SizedBox(height: 8),
            Text(
''',
          )

          Path('.upgrade_marker').write_text('chat-ai-media-upgrade')
      - name: Verify Flutter code
        run: |
          flutter pub get
          dart format lib/chat_page.dart lib/status_page.dart lib/gg_ai_page.dart lib/gg_image_page.dart
          flutter analyze --no-fatal-infos
      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml lib/chat_page.dart lib/status_page.dart lib/gg_ai_page.dart lib/gg_image_page.dart .upgrade_marker
          git diff --cached --quiet && exit 0
          git commit -m 'feat: upgrade chat AI media voice and feedback [skip ci]'
          git push
