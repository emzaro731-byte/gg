name: Verify GG AI syntax fix
on:
  push:
    paths:
      - 'lib/gg_ai_page.dart'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/gg_ai_page.dart
      - run: flutter analyze --no-fatal-infos lib/gg_ai_page.dart