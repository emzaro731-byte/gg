name: gg_messenger
description: A modern realtime messenger built with Flutter and Supabase.
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  file_picker: ^10.3.3
  flutter_webrtc: ^1.6.2+hotfix.1
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
