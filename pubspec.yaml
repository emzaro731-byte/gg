name: gg_messenger
description: A modern, secure realtime messenger built with Flutter and Supabase.
publish_to: 'none'
version: 0.12.0+12

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  http: ^1.6.0
  connectivity_plus: ^6.1.5
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  image: ^4.5.4
  flutter_webrtc: ^1.6.2+hotfix.1
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.5
  video_player: ^2.14.0
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.4.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  share_plus: ^10.1.4
  flutter_svg: ^2.2.1
  file_saver: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/gg_logo.svg
    - assets/branding/gg_logo.png
    - assets/branding/gg_logo_icon.png
